<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="40 70 432 432">
  <!-- Icono de NuzTheLocke: un cuaderno rojo con dos marcapáginas arriba y la goma burdeos.
       Sin borde negro, para que se vea igual sobre fondos oscuros y claros. El mismo dibujo va
       dentro de index.html (el logo del menú, con viewBox de 512 para que los marcapáginas
       puedan subir al pasar el ratón): si cambia uno, cambiar el otro. -->
  <!-- Marcapáginas (por abajo quedan detrás de la tapa) -->
  <rect x="146" y="80" width="74" height="120" rx="12" fill="#f0c43c"/>
  <rect x="238" y="106" width="56" height="94" rx="12" fill="#6a9fe0"/>
  <!-- Hojas, tapa y lomo -->
  <rect x="88" y="140" width="336" height="352" rx="34" fill="#f4ead6"/>
  <rect x="88" y="140" width="310" height="352" rx="34" fill="#e74c3c"/>
  <path d="M122 140H130V492H122A34 34 0 0 1 88 458V174A34 34 0 0 1 122 140Z" fill="#c0392b"/>
  <!-- Goma -->
  <rect x="340" y="140" width="24" height="352" fill="#9b2c22"/>
  <!-- Etiqueta -->
  <rect x="164" y="210" width="136" height="82" rx="14" fill="#f4ead6"/>
  <path d="M188 241H276M188 263H246" stroke="#e3a196" stroke-width="10" stroke-linecap="round"/>
</svg>
