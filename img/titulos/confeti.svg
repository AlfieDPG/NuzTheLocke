<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Confeti de celebración (Campeón de la Liga): una tesela que se repite y baja sin cortes.
       Trocitos pequeños y algo transparentes, para que se lea el título -->
  <g stroke="#0d1a3a" stroke-width="0.8" opacity="0.8">
    <rect x="5" y="4" width="3" height="5.5" rx="0.6" fill="#ffd34d" transform="rotate(25 6.5 6.75)"/>
    <rect x="24" y="9" width="3" height="5.5" rx="0.6" fill="#ff6b6b" transform="rotate(-35 25.5 11.75)"/>
    <rect x="14" y="20" width="3" height="5.5" rx="0.6" fill="#6fe0ff" transform="rotate(60 15.5 22.75)"/>
    <rect x="32" y="26" width="3" height="5.5" rx="0.6" fill="#7be07b" transform="rotate(15 33.5 28.75)"/>
    <rect x="21" y="32" width="3" height="5.5" rx="0.6" fill="#ffd34d" transform="rotate(-15 22.5 34.75)"/>
    <circle cx="6" cy="31" r="1.6" fill="#ffffff"/>
    <circle cx="34" cy="15" r="1.4" fill="#ff9be0"/>
  </g>
</svg>
