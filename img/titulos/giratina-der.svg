<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 60">
  <!-- Rey del Inframundo: las alas de Giratina del lado DERECHO de la plaquita: giratina.svg en
       espejo y con otros ritmos. GENERADO por herramientas/generar-giratina.mjs: no se toca a mano. -->
  <style>
    .cinta { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .fondo { stroke: #0c090e; stroke-width: 5; }
    .lustre { stroke: #342b3a; stroke-width: 1.6; }
    .resplandor { fill: #ff2626; filter: url(#difuso); animation: late 2.2s ease-in-out infinite; }
    .a { transform-origin: 6px 27px; animation: mece-a 5.2s ease-in-out infinite; }
    .b { transform-origin: 6px 33px; animation: mece-b 4.3s ease-in-out infinite; }
    .c { transform-origin: 6px 30px; animation: mece-c 4.4s ease-in-out infinite; }
    .a path.cinta { animation: retuerce-a 3.6s ease-in-out infinite; }
    .b path.cinta { animation: retuerce-b 3.2s ease-in-out infinite; }
    .c path.cinta { animation: retuerce-c 3.1s ease-in-out infinite; }
    @keyframes late { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes mece-a { 0%, 100% { transform: rotate(0deg); } 27% { transform: rotate(5deg); } 52% { transform: rotate(-2deg); } 78% { transform: rotate(2deg); } }
    @keyframes mece-b { 0%, 100% { transform: rotate(0deg); } 31% { transform: rotate(-4deg); } 58% { transform: rotate(2deg); } 83% { transform: rotate(-3deg); } }
    @keyframes mece-c { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(-6deg); } 70% { transform: rotate(3deg); } }
    @keyframes retuerce-a {
      0%, 100% { d: path("M6 27 C15 27 18 17 24 16 C30 15 33 9 29 6 C25 3 17 4 12 8"); }
      35% { d: path("M6 27 C14 26 19 19 25 17.5 C31 16 34 11 30 7 C26 3 17 4 12 8"); }
      70% { d: path("M6 27 C16 28 17 15 23 14.5 C29 14 32 8 28 5.5 C24 3 17 4 12 8"); }
    }
    @keyframes retuerce-b {
      0%, 100% { d: path("M6 33 C15 33 18 41 24 43 C30 45 33 50 28 53 C23 56 16 55 12 51"); }
      40% { d: path("M6 33 C14 34 19 40 25 42 C31 44 34 49 29 52.5 C24 56 16 55 12 51"); }
      75% { d: path("M6 33 C16 32 17 42 23 44 C29 46 32 51 27 53.5 C22 56 16 55 12 51"); }
    }
    @keyframes retuerce-c {
      0%, 100% { d: path("M6 30 C13 30 16 27 21 28.5 C26 30 29 32 35 30"); }
      45% { d: path("M6 30 C13 31 17 29 21.5 30 C26 31 29 32 35 30"); }
      80% { d: path("M6 30 C13 29 15 26 20 27 C25 28.5 29 32 35 30"); }
    }
    @media (prefers-reduced-motion: reduce) {
      .a, .b, .c, .a path.cinta, .b path.cinta, .c path.cinta, .resplandor { animation: none; }
    }
  </style>
  <defs>
    <filter id="difuso" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- La del medio, más corta, con la punta hacia fuera (detrás de las otras dos) -->
  <g class="c">
    <path class="resplandor" d="M34.27 27.82 L40.69 28.1 L35.73 32.18 Z"/>
    <path class="cinta fondo" d="M6 30 C13 30 16 27 21 28.5 C26 30 29 32 35 30"/>
    <path class="cinta lustre" d="M6 30 C13 30 16 27 21 28.5 C26 30 29 32 35 30"/>
    <path d="M34.27 27.82 L40.69 28.1 L35.73 32.18 Z" fill="#e3233a" stroke="#5a0a14" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M35.1 29 L38.8 28.6 L35.7 30.8 Z" fill="#ff9a8a"/>
  </g>

  <!-- La de arriba: sube hacia fuera y vuelve, con la punta hacia la esquina de arriba de la plaquita -->
  <g class="a">
    <path class="resplandor" d="M13.62 10.03 L6.53 12.38 L10.37 5.97 Z"/>
    <path class="cinta fondo" d="M6 27 C15 27 18 17 24 16 C30 15 33 9 29 6 C25 3 17 4 12 8"/>
    <path class="cinta lustre" d="M6 27 C15 27 18 17 24 16 C30 15 33 9 29 6 C25 3 17 4 12 8"/>
    <path d="M13.62 10.03 L6.53 12.38 L10.37 5.97 Z" fill="#e3233a" stroke="#5a0a14" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M11.8 9.2 L8.1 11.3 L10.4 7.6 Z" fill="#ff9a8a"/>
  </g>

  <!-- La de abajo: baja hacia fuera y vuelve, con la punta hacia la esquina de abajo de la plaquita -->
  <g class="b">
    <path class="resplandor" d="M10.16 52.84 L7.05 46.05 L13.84 49.16 Z"/>
    <path class="cinta fondo" d="M6 33 C15 33 18 41 24 43 C30 45 33 50 28 53 C23 56 16 55 12 51"/>
    <path class="cinta lustre" d="M6 33 C15 33 18 41 24 43 C30 45 33 50 28 53 C23 56 16 55 12 51"/>
    <path d="M10.16 52.84 L7.05 46.05 L13.84 49.16 Z" fill="#e3233a" stroke="#5a0a14" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M10.8 51 L8.4 47.6 L12 49.4 Z" fill="#ff9a8a"/>
  </g>
</svg>
