<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Monedas que caen (Leyenda del Casino): una tesela que se repite y baja sin cortes.
       Una de frente, una de lado y una a medio girar; medio transparentes, para que se lea el título -->
  <g stroke="#7a4f00" stroke-width="1.3" opacity="0.75">
    <circle cx="8" cy="9" r="3.6" fill="#ffd34d"/>
    <circle cx="8" cy="9" r="2" fill="none" stroke="#c89212" stroke-width="0.9"/>
    <ellipse cx="27" cy="20" rx="1.5" ry="3.6" fill="#f1b72a"/>
    <ellipse cx="17" cy="33" rx="2.6" ry="3.6" fill="#ffd34d"/>
  </g>
</svg>
