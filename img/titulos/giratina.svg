<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 60">
  <!-- Rey del Inframundo: las alas de Giratina del lado izquierdo de la plaquita (el derecho,
       giratina-der.svg, es este en espejo y con otros ritmos: lo GENERA herramientas/generar-giratina.mjs
       a partir de este, así que después de tocar este hay que volver a ejecutarlo). Tres cintas negras que salen
       del borde (x = 40-42, a media altura): la de arriba y la de abajo se curvan y vuelven hacia la
       plaquita, la del medio apunta hacia fuera; todas acaban en un pincho rojo que brilla.
       Se retuercen por el medio (la curva cambia, las puntas no) y se mecen un poco, cada una a su
       ritmo, y los pinchos laten. Sin movimiento si se pide reducirlo. -->
  <style>
    .cinta { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .fondo { stroke: #0c090e; stroke-width: 5; }
    .lustre { stroke: #342b3a; stroke-width: 1.6; }
    .resplandor { fill: #ff2626; filter: url(#difuso); animation: late 1.8s ease-in-out infinite; }
    .a { transform-origin: 42px 27px; animation: mece-a 4.6s ease-in-out infinite; }
    .b { transform-origin: 42px 33px; animation: mece-b 5.3s ease-in-out infinite; }
    .c { transform-origin: 42px 30px; animation: mece-c 3.9s ease-in-out infinite; }
    .a path.cinta { animation: retuerce-a 3.1s ease-in-out infinite; }
    .b path.cinta { animation: retuerce-b 3.7s ease-in-out infinite; }
    .c path.cinta { animation: retuerce-c 2.7s ease-in-out infinite; }
    @keyframes late { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes mece-a { 0%, 100% { transform: rotate(0deg); } 27% { transform: rotate(-5deg); } 52% { transform: rotate(2deg); } 78% { transform: rotate(-2deg); } }
    @keyframes mece-b { 0%, 100% { transform: rotate(0deg); } 31% { transform: rotate(4deg); } 58% { transform: rotate(-2deg); } 83% { transform: rotate(3deg); } }
    @keyframes mece-c { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(6deg); } 70% { transform: rotate(-3deg); } }
    @keyframes retuerce-a {
      0%, 100% { d: path("M42 27 C33 27 30 17 24 16 C18 15 15 9 19 6 C23 3 31 4 36 8"); }
      35% { d: path("M42 27 C34 26 29 19 23 17.5 C17 16 14 11 18 7 C22 3 31 4 36 8"); }
      70% { d: path("M42 27 C32 28 31 15 25 14.5 C19 14 16 8 20 5.5 C24 3 31 4 36 8"); }
    }
    @keyframes retuerce-b {
      0%, 100% { d: path("M42 33 C33 33 30 41 24 43 C18 45 15 50 20 53 C25 56 32 55 36 51"); }
      40% { d: path("M42 33 C34 34 29 40 23 42 C17 44 14 49 19 52.5 C24 56 32 55 36 51"); }
      75% { d: path("M42 33 C32 32 31 42 25 44 C19 46 16 51 21 53.5 C26 56 32 55 36 51"); }
    }
    @keyframes retuerce-c {
      0%, 100% { d: path("M42 30 C35 30 32 27 27 28.5 C22 30 19 32 13 30"); }
      45% { d: path("M42 30 C35 31 31 29 26.5 30 C22 31 19 32 13 30"); }
      80% { d: path("M42 30 C35 29 33 26 28 27 C23 28.5 19 32 13 30"); }
    }
    @media (prefers-reduced-motion: reduce) {
      .a, .b, .c, .a path.cinta, .b path.cinta, .c path.cinta, .resplandor { animation: none; }
    }
  </style>
  <defs>
    <filter id="difuso" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- La del medio, más corta, con la punta hacia fuera (detrás de las otras dos) -->
  <g class="c">
    <path class="resplandor" d="M13.73 27.82 L7.31 28.1 L12.27 32.18 Z"/>
    <path class="cinta fondo" d="M42 30 C35 30 32 27 27 28.5 C22 30 19 32 13 30"/>
    <path class="cinta lustre" d="M42 30 C35 30 32 27 27 28.5 C22 30 19 32 13 30"/>
    <path d="M13.73 27.82 L7.31 28.1 L12.27 32.18 Z" fill="#e3233a" stroke="#5a0a14" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M12.9 29 L9.2 28.6 L12.3 30.8 Z" fill="#ff9a8a"/>
  </g>

  <!-- La de arriba: sube hacia fuera y vuelve, con la punta hacia la esquina de arriba de la plaquita -->
  <g class="a">
    <path class="resplandor" d="M34.38 10.03 L41.47 12.38 L37.63 5.97 Z"/>
    <path class="cinta fondo" d="M42 27 C33 27 30 17 24 16 C18 15 15 9 19 6 C23 3 31 4 36 8"/>
    <path class="cinta lustre" d="M42 27 C33 27 30 17 24 16 C18 15 15 9 19 6 C23 3 31 4 36 8"/>
    <path d="M34.38 10.03 L41.47 12.38 L37.63 5.97 Z" fill="#e3233a" stroke="#5a0a14" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M36.2 9.2 L39.9 11.3 L37.6 7.6 Z" fill="#ff9a8a"/>
  </g>

  <!-- La de abajo: baja hacia fuera y vuelve, con la punta hacia la esquina de abajo de la plaquita -->
  <g class="b">
    <path class="resplandor" d="M37.84 52.84 L40.95 46.05 L34.16 49.16 Z"/>
    <path class="cinta fondo" d="M42 33 C33 33 30 41 24 43 C18 45 15 50 20 53 C25 56 32 55 36 51"/>
    <path class="cinta lustre" d="M42 33 C33 33 30 41 24 43 C18 45 15 50 20 53 C25 56 32 55 36 51"/>
    <path d="M37.84 52.84 L40.95 46.05 L34.16 49.16 Z" fill="#e3233a" stroke="#5a0a14" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M37.2 51 L39.6 47.6 L36 49.4 Z" fill="#ff9a8a"/>
  </g>
</svg>
